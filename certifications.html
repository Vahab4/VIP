<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications | Vahab4</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-box {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            width: 100%;
            max-width: 350px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .cert-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .cert-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .cert-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .cert-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent-color);
            flex-shrink: 0;
        }

        .cert-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
        }

        .btn-open {
            display: block;
            width: 100%;
            text-align: center;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .btn-open:hover {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 2rem;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Certifications & Credentials</h1>
            <p>Verified qualifications and documents</p>
        </header>

        <div class="search-filter-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search certifications..." onkeyup="filterCerts()">
        </div>

        <main class="cert-grid" id="certGrid">
            <div class="status-message">Loading certifications...</div>
        </main>

        <footer>
            <p>&copy; 2026 Vahab4. Hosted on GitHub Pages.</p>
        </footer>
    </div>

    <script>
        const pdfFolder = "Certifications";

        async function loadCertifications() {
            const grid = document.getElementById('certGrid');
            
            try {
                const response = await fetch('./certifications.json');
                if (!response.ok) throw new Error('Could not find certifications.json');
                
                const pdfFiles = await response.json();

                if (!pdfFiles || pdfFiles.length === 0) {
                    grid.innerHTML = '<div class="status-message">No certificates found.</div>';
                    return;
                }

                grid.innerHTML = '';

                pdfFiles.forEach(fileName => {
                    // Extract clean title from filename (e.g. "aws_certificate.pdf" -> "Aws Certificate")
                    const cleanTitle = fileName
                        .replace(/\.pdf$/i, '')
                        .replace(/[-_]/g, ' ')
                        .toUpperCase();

                    const pdfPath = `${pdfFolder}/${fileName}`;

                    const card = document.createElement('article');
                    card.className = 'cert-card';
                    card.innerHTML = `
                        <div>
                            <div class="cert-header">
                                <div class="cert-icon">PDF</div>
                                <h2 class="cert-title">${cleanTitle}</h2>
                            </div>
                        </div>
                        <a href="${pdfPath}" target="_blank" rel="noopener noreferrer" class="btn-open">
                            View Certificate PDF
                        </a>
                    `;

                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="status-message">Error loading certifications. Make sure certifications.json exists.</div>`;
            }
        }

        function filterCerts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.cert-card');

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? "flex" : "none";
            });
        }

        // Initialize on page load
        loadCertifications();
    </script>
</body>
</html>
